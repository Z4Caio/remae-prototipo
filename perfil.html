<div class="container">
  <div class="perfil-topo">
    <span class="avatar">F</span>
    <div>
      <h1 style="margin:0;">Fernanda Martins</h1>
      <p style="margin:0; color:var(--cor-texto-suave);">São Paulo - SP</p>
    </div>
  </div>

  <div class="card">
    <form onsubmit="event.preventDefault(); salvarPerfil();">
      <label for="nome">Nome</label>
      <input type="text" id="nome" value="Fernanda Martins">

      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" value="São Paulo - SP">

      <label for="experiencias">Experiências profissionais</label>
      <textarea id="experiencias" rows="3">Assistente administrativa (3 anos) — Comércio Ltda.</textarea>

      <label for="habilidades">Habilidades</label>
      <input type="text" id="habilidades" value="Pacote Office, atendimento ao cliente, organização">

      <label for="disponibilidade">Disponibilidade</label>
      <select id="disponibilidade">
        <option>Meio período</option>
        <option>Período integral</option>
        <option>Apenas remoto</option>
        <option>Flexível</option>
      </select>

      <label for="modalidade">Modalidade desejada</label>
      <select id="modalidade">
        <option>Remoto</option>
        <option>Híbrido</option>
        <option>Presencial</option>
        <option>Tanto faz</option>
      </select>

      <button type="submit" class="btn" style="margin-top:18px;">Salvar alterações</button>
    </form>

    <div id="mensagem-sucesso" class="mensagem-sucesso">Perfil atualizado com sucesso!</div>
  </div>

  <footer>Protótipo de estudo — Mãe Conecta. Todos os dados exibidos são fictícios. · <a href="privacidade.html">Política de Privacidade</a></footer>
</div>

<script>
function salvarPerfil() {
  const msg = document.getElementById('mensagem-sucesso');
  msg.style.display = 'block';
}
</script>
