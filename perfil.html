<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mãe Conecta — Perfil</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<di class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Carregando o site">
  <div class="preloader-inner">
    <div class="preloader-orb" aria-hidden="true"></div>
    <p class="preloader-text">Preparando um espaço para você</p>
    <div class="preloader-track"><span class="preloader-fill"></span></div>
  </div>
</di
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo"><img src="img/logo2.webp" alt="Mãe Conecta"></a>
    <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false"></button>
    <div class="nav-links">
      <a href="perfil.html" class="so-celular">Meu perfil</a>
      <a href="index.html">Início</a>
      <a href="vagas.html">Vagas</a>
      <a href="forum.html">Fórum</a>
      <a href="comunidade.html">Comunidade</a>
      <a href="empreendedorismo.html">Empreendedorismo</a>
      <a href="direitos.html">Direitos</a>
      <a href="simulador.html">Simulador IA</a>
    </div>
    <a href="perfil.html" class="nav-perfil ativo"><span class="avatar">F</span></a>
  </div>
</nav>

<main id="conteudo" class="container">
  <div class="perfil-topo reveal">
    <span class="avatar">F</span>
    <div>
      <p class="kicker">Conta</p>
      <h1 style="margin:0;">Fernanda Martins</h1>
      <p style="margin:0; color:var(--cor-texto-suave);">São Paulo - SP</p>
    </div>
  </div>

  <div class="card">
    <form onsubmit="event.preventDefault(); salvarPerfil();">
      <label for="nome">Nome</label>
      <input type="text" id="nome" value="Fernanda Martins">

      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" value="São Paulo - SP">

      <label for="experiencias">Experiências profissionais</label>
      <textarea id="experiencias" rows="3">Assistente administrativa (3 anos) — Comércio Ltda.</textarea>

      <label for="habilidades">Habilidades</label>
      <input type="text" id="habilidades" value="Pacote Office, atendimento ao cliente, organização">

      <label for="disponibilidade">Disponibilidade</label>
      <select id="disponibilidade">
        <option>Meio período</option>
        <option>Período integral</option>
        <option>Apenas remoto</option>
        <option>Flexível</option>
      </select>

      <label for="modalidade">Modalidade desejada</label>
      <select id="modalidade">
        <option>Remoto</option>
        <option>Híbrido</option>
        <option>Presencial</option>
        <option>Tanto faz</option>
      </select>

      <button type="submit" class="btn" style="margin-top:18px;">Salvar alterações</button>
    </form>

    <div id="mensagem-sucesso" class="mensagem-sucesso">Perfil atualizado com sucesso!</div>
  </div>
</main>

<script>
function salvarPerfil() {
  const msg = document.getElementById('mensagem-sucesso');
  msg.style.display = 'block';
}
</script>

<script src="js/menu.js"></script>
<script src="js/ui.js"></script>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
</body>
</html>
