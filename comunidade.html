</head>
<body>

  <div class="preloader-inner">
    <div class="preloader-orb" aria-hidden="true"></div>
    <p class="preloader-text">Preparando um espaço para você</p>
    <div class="preloader-track"><span class="preloader-fill"></span></div>
  </div>
</div>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo"><img src="img/logo2.webp" alt="Mãe Conecta"></a>
    <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false"></button>
    <div class="nav-links">
      <a href="perfil.html" class="so-celular">Meu perfil</a>
      <a href="index.html">Início</a>
      <a href="vagas.html">Vagas</a>

    </div>

  </div>
</nav>

<main id="conteudo" class="container">
  <div class="page-header reveal">
    <p class="kicker">Rede</p>
    <h1>Comunidade</h1>
    <p>Compartilhe conquistas, peça ajuda, faça networking — um feed aberto entre todas as mães do Mãe Conecta.</p>
  </div>

  <img class="media reveal" src="img/illu-comunidade.webp" alt="Mulheres reunidas em um círculo de apoio" style="max-height:280px; margin-bottom:20px; object-position:center 30%;">

  <div class="card" style="margin-bottom:20px;">
    <label for="novo-post">Compartilhar algo com a comunidade</label>
    <textarea id="novo-post" rows="2" placeholder="No que você está pensando hoje?"></textarea>
    <button class="btn" style="margin-top:10px;" onclick="publicarPost()">Publicar</button>
  </div>

  <div id="feed"></div>

  <div id="confirmacao-denuncia" class="mensagem-sucesso" style="background:#fff2e0; color:#7a4b00;"></div>
</main>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script>
const rotulos = {
  conquista: { texto: "Conquista", classe: "sucesso" },
  divulgação: { texto: "Divulgação", classe: "" },
  "pedido de ajuda": { texto: "Pedido de ajuda", classe: "selo" },
  networking: { texto: "Networking", classe: "" }
};

function renderizarFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = comunidadePosts.map((p, i) => {
    const rotulo = rotulos[p.tipo] || { texto: p.tipo, classe: "" };
    return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:start;">
        <div>
          <strong>${p.autora}</strong>
          <div class="topico-meta">${p.cargo}</div>
        </div>
        <span class="tag ${rotulo.classe}">${rotulo.texto}</span>
      </div>
      <p style="margin:12px 0;">${p.texto}</p>
      <div class="feed-actions">
        <button class="denunciar-link" style="color:var(--cor-primaria-escura); font-weight:600;" onclick="curtir(${i})">${ICON.like} Curtir (${p.curtidas})</button>
        <span class="topico-meta">${p.comentarios.length} comentário(s)</span>
        <button class="denunciar-link" onclick="denunciarPost(${i})">${ICON.flag} Denunciar</button>
      </div>
      ${p.comentarios.map(c => `
        <div class="resposta" style="margin-top:10px;">
          <div class="autora">${c.autora}</div>
          <div>${c.texto}</div>
        </div>
      `).join('')}
      <div class="comment-row">
        <input type="text" id="comentario-${i}" placeholder="Escreva um comentário..." style="flex:1;">
        <button class="btn secundario" onclick="comentar(${i})">Comentar</button>
      </div>
    </div>
  `;
  }).join('');
}

function curtir(i) {
  comunidadePosts[i].curtidas++;
  renderizarFeed();
}

function comentar(i) {
  const campo = document.getElementById(`comentario-${i}`);
  const texto = campo.value.trim();
  if (!texto) return;
  comunidadePosts[i].comentarios.push({ autora: 'Você', texto });
  renderizarFeed();
}

function denunciarPost(i) {
  const msg = document.getElementById('confirmacao-denuncia');
  msg.textContent = 'Denúncia enviada. Nossa equipe vai revisar em até 24h (simulação).';
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 3500);
}

function publicarPost() {
  const campo = document.getElementById('novo-post');
  const texto = campo.value.trim();
  if (!texto) return;

  comunidadePosts.unshift({
    id: comunidadePosts.length + 1,
    autora: "Você",
    cargo: "Membro da comunidade Mãe Conecta",
    tipo: "networking",
    texto,
    curtidas: 0,
    comentarios: []
  });

  campo.value = '';
  renderizarFeed();
}

renderizarFeed();
</script>

<script src="js/menu.js"></script>
<script src="js/ui.js"></script>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
</body>
</html>
