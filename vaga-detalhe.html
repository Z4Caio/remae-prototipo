<script>
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id'));
const vaga = vagas.find(v => v.id === id);
const container = document.getElementById('conteudo-vaga');

if (vaga) {
  container.innerHTML = `
    ${vaga.selo ? '<span class="tag selo">Selo Empresa Amiga da Maternidade</span>' : ''}
    <h1>${vaga.titulo}</h1>
    <div class="empresa">${vaga.empresa} · ${vaga.local}</div>
    <span class="tag">${vaga.modalidade}</span>
    <span class="tag">${vaga.tipo}</span>

    <h3 style="margin-top:20px;">Descrição</h3>
    <p>${vaga.descricao}</p>

    <h3>Requisitos</h3>
    <ul class="lista-requisitos">
      ${vaga.requisitos.map(r => `<li>${r}</li>`).join('')}
    </ul>

    <button class="btn" onclick="candidatar()">Candidatar-se</button>
  `;
} else {
  container.innerHTML = '<p>Vaga não encontrada.</p>';
}

function candidatar() {
  const msg = document.getElementById('confirmacao');
  msg.textContent = 'Candidatura enviada! (simulação — nenhum dado foi enviado de verdade)';
  msg.style.display = 'block';
}
</script>
